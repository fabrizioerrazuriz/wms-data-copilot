[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wms-data-copilot"
version = "0.1.0"
description = "Copiloto de datos sobre un pipeline WMS: Text-to-SQL con guardrails, RAG sobre documentacion y agente de calidad de datos."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Fabrizio Errazuriz" }]
dependencies = [
  "SQLAlchemy>=2.0.36",
  "sqlglot>=25.24",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "httpx>=0.27",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8.3", "ruff>=0.7"]

[project.scripts]
wms-copilot = "wms_copilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wms_copilot = ["pipeline/schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
