name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  WMS_LLM_PROVIDER: rule-based
  WMS_EMBEDDING_PROVIDER: hashing
  WMS_DB_URL: sqlite:///./data/ci.db

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Tests (pytest)
        run: python -m pytest -q

      - name: Bootstrap (datos sinteticos + carga + KB)
        run: python -m wms_copilot.cli bootstrap

      - name: Escaneo de calidad de datos
        run: python -m wms_copilot.cli quality

      - name: Evaluacion del copiloto (gate de regresion)
        run: python -m wms_copilot.cli eval --min-pass 0.6

      - name: Subir evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            artifacts/eval_report.json
            artifacts/rejected_*.csv
          if-no-files-found: ignore

  docker-build:
    runs-on: ubuntu-latest
    needs: quality-gate
    steps:
      - uses: actions/checkout@v4
      - name: Build de la imagen
        run: docker build -t wms-data-copilot:ci .
